[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/sigmastone-io/epistel"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
epistel-core = { path = "crates/epistel-core", version = "0.1.0" }
epistel-aws = { path = "crates/epistel-aws", version = "0.1.0" }

argon2 = "0.5"
async-trait = "0.1"
aws-config = "1"
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
bytes = "1"
getrandom = "0.3"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", default-features = false }
toml = "1"
uuid = { version = "1", features = ["v4"] }
