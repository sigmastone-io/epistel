# Example configuration for Epistel.
#
# Every backend section has a `backend` key that picks the implementation. "memory" keeps
# everything in the process and loses it on exit; it is for trying things out. The cloud
# alternatives are shown in comments. Credentials are never written here: they come from the
# environment, a profile, or the role of the machine.

[server]
# The name mail clients connect to. The certificate must be issued for it.
hostname = "mail.example.org"

[tls]
# PEM files. There is no way to run without TLS.
certificate = "/etc/epistel/tls/fullchain.pem"
private_key = "/etc/epistel/tls/key.pem"

[imap]
listen = "[::]:993"

[submission]
listen = "[::]:465"
max_message_size = "40MB"

# Mailboxes that have to exist. The server makes the missing ones when it starts, with their
# folders; it never removes one. A password for a mailbox comes from `epistel password new`.
[[mailbox]]
address = "ada@example.org"
name = "Ada"
aliases = ["sales@example.org"]         # optional; "*@example.org" takes a whole domain

[[mailbox]]
address = "support@example.org"

[metadata]
backend = "memory"
# backend = "dynamodb"
# table = "epistel"
# region = "eu-west-1"                  # optional; taken from the environment when left out
# endpoint = "http://localhost:8000"    # optional; only for emulators

[blobs]
backend = "memory"
# backend = "s3"
# bucket = "example-epistel-mail"
# prefix = "blobs/"                     # optional; this is the default
# region = "eu-west-1"                  # optional
# endpoint = "http://localhost:9000"    # optional; only for emulators and S3-compatible stores

[inbound]
backend = "memory"
# backend = "ses-sqs"                   # Amazon SES receipt notifications from an SQS queue
# queue_url = "https://sqs.eu-west-1.amazonaws.com/123456789012/epistel-inbound"
# region = "eu-west-1"                  # optional

[outbound]
backend = "memory"
# backend = "ses"                       # the Amazon SES v2 send API
# region = "eu-west-1"                  # optional
# configuration_set = "epistel"         # optional
