name: ci

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # Stand-ins for DynamoDB and S3, so that the cloud backends run their conformance suites here.
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
      s3:
        image: adobe/s3mock
        ports:
          - 9090:9090
    env:
      EPISTEL_TEST_DYNAMODB_ENDPOINT: http://localhost:8000
      EPISTEL_TEST_S3_ENDPOINT: http://localhost:9090
      # The emulators check that a request is signed, never by whom.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: locallocal
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
