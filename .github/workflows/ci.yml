name: ci

on:
  push:
    branches: [dev]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    # Stand-ins for DynamoDB, S3 and SQS, so that the cloud backends run their conformance suites here.
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
      s3:
        image: adobe/s3mock
        ports:
          - 9090:9090
      sqs:
        image: softwaremill/elasticmq-native
        ports:
          - 9324:9324
    env:
      EPISTEL_TEST_DYNAMODB_ENDPOINT: http://localhost:8000
      EPISTEL_TEST_S3_ENDPOINT: http://localhost:9090
      EPISTEL_TEST_SQS_ENDPOINT: http://localhost:9324
      # The emulators check that a request is signed, never by whom.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: locallocal
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: python3 -m unittest discover -s tools -p "test_*.py"

  # The container image, built from what the checks above passed. It always goes to this
  # repository's own registry. It also goes to an Amazon ECR repository when the repository
  # variables name one: AWS_ROLE_ARN (a role this workflow may assume through GitHub's identity
  # provider), AWS_REGION and ECR_REPOSITORY (the repository's name). Nothing about any
  # particular deployment is written here.
  image:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Amazon ECR
        id: ecr
        if: vars.AWS_ROLE_ARN != '' && vars.ECR_REPOSITORY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Find the ECR registry
        id: registry
        if: steps.ecr.outcome == 'success'
        uses: aws-actions/amazon-ecr-login@v2
      # Every image is tagged with its commit. A release tag (v0.1.0) adds the version, and on
      # this repository's registry also the minor line (0.1), which moves with each patch release.
      # ECR repositories are often immutable, so they get the commit and the full version only.
      - name: Name the image
        id: names
        run: |
          ghcr="ghcr.io/${GITHUB_REPOSITORY,,}"
          names="${ghcr}:${GITHUB_SHA}"
          version=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            version="${GITHUB_REF_NAME#v}"
            names="${names},${ghcr}:${version}"
            if [ -z "${BASH_REMATCH[3]}" ]; then
              names="${names},${ghcr}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            fi
          fi
          if [ -n "${ECR_REGISTRY}" ]; then
            names="${names},${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
            if [ -n "${version}" ]; then
              names="${names},${ECR_REGISTRY}/${ECR_REPOSITORY}:${version}"
            fi
          fi
          echo "names=${names}" >> "$GITHUB_OUTPUT"
          echo "version=${version:-${GITHUB_SHA}}" >> "$GITHUB_OUTPUT"
        env:
          ECR_REGISTRY: ${{ steps.registry.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.names.outputs.names }}
          labels: |
            org.opencontainers.image.version=${{ steps.names.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # One manifest, so that the digest printed below is the image itself.
          provenance: false
      - name: Report the digest
        run: |
          echo "Image tags: \`${NAMES}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Image digest: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy by digest: \`<repository>@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          NAMES: ${{ steps.names.outputs.names }}
